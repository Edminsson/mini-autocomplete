<h2>Typeaheaad</h2>
<p>Manuell hantering av paneler. Keymanager för tangenthantering.</p>
<div class="typeahead-container">
  <input 
    #input
    type="text"
    [formControl]="searchControl"
    (keydown)="onKeydown($event)"
    (focus)="openPanel()">
</div>

<ng-template #resultsPanel>
  <div class="results-panel" id="results-list" role="listbox">

    @for (option of filteredOptions | async; track option; let i = $index) {
      <app-typeahead-option
        class="result-item"
        [class.active]="keyManager?.activeItemIndex === i"
        (click)="selectState(option)"
        role="option"
        [id]="'option-' + i">
        {{ option }}
      </app-typeahead-option>
    }
  </div>
</ng-template>
